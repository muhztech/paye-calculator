<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Muhztech Tax Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tesseract OCR -->
  <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #f9fafb);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 6px;
    }

    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
    }

    .upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 16px;
      background: #f8fafc;
      text-align: center;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 8px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: #0f172a;
    }

    button:hover {
      opacity: 0.95;
    }

    .loading {
      text-align: center;
      margin-top: 14px;
      color: #b45309;
      font-weight: 500;
    }

    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #f1f5f9;
      font-size: 14px;
      line-height: 1.6;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Muhztech PAYE Calculator</h2>
    <p class="subtitle">Nigeria Tax Reform (2026)</p>

    <label>Upload Payslip (Gallery)</label>
    <div class="upload-box">
      <input type="file" id="fileInput" accept="image/*" onchange="handlePayslipSelection(event)">
    </div>

    <button class="secondary" onclick="openCamera()">📷 Take Photo</button>

    <img id="previewImage">

    <button onclick="processPayslip()">Process PAYE</button>

    <p class="loading" id="loading"></p>
    <div class="result" id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
