<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nigeria PAYE Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tesseract OCR -->
  <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, #e0eaff, transparent 60%),
        radial-gradient(circle at bottom right, #fef3c7, transparent 55%),
        linear-gradient(135deg, #eef2f7, #f9fafb);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e0ecff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: #64748b;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
      display: block;
    }

    .upload-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .upload-box button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    button.process-btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button.process-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35);
    }

    .loading {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #b45309;
    }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f8fafc, #eef2f7);
      border: 1px solid #e5e7eb;
      font-size: 14px;
      color: #0f172a;
      line-height: 1.7;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="header">
      <div class="badge">PAYE • OCR Powered</div>
      <h2>Muhztech PAYE Calculator</h2>
      <p>Take a photo or upload your payslip</p>
    </div>

    <label>Upload / Capture Payslip</label>
    <div class="upload-box">
      <!-- Camera Button -->
      <button type="button" onclick="document.getElementById('cameraInput').click()">
        📷 Take Photo
      </button>
      <input type="file" id="cameraInput" accept="image/*" capture>

      <!-- Gallery Button -->
      <button type="button" onclick="document.getElementById('galleryInput').click()">
        📁 Upload from Gallery
      </button>
      <input type="file" id="galleryInput" accept="image/*">

      <div class="hint">
        Take a photo or select from gallery • JPG / PNG • Recommended under 3MB
      </div>
    </div>

    <button class="process-btn" onclick="processPayslip()">Process Payslip</button>

    <p class="loading" id="loading"></p>
    <div class="result" id="result"></div>

    <div class="footer">
      © 2026 Muhztech · PAYE Automation System
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    // Forward selected file from camera or gallery to processPayslip
    document.getElementById('cameraInput').addEventListener('change', (e) => {
      if(e.target.files.length) {
        processPayslip(e.target.files[0]);
      }
    });

    document.getElementById('galleryInput').addEventListener('change', (e) => {
      if(e.target.files.length) {
        processPayslip(e.target.files[0]);
      }
    });
  </script>

</body>
</html>
