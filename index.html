<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nigeria PAYE & Self-Employed Tax Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tesseract OCR -->
  <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #f9fafb);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #fff;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 6px;
    }

    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      background: #e5e7eb;
    }

    .tabs button.active {
      background: #2563eb;
      color: #fff;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      margin-bottom: 14px;
    }

    input[type="file"] {
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
      cursor: pointer;
    }

    button.main {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      margin-top: 14px;
      color: #b45309;
    }

    .result {
      margin-top: 18px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.7;
      font-size: 14px;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

<div class="card">
  <h2>Muhztech Tax Calculator</h2>
  <p class="subtitle">PAYE & Self-Employed (2026 Reform)</p>

  <!-- Tabs -->
  <div class="tabs">
    <button id="payeTab" class="active" onclick="showPAYE()">PAYE</button>
    <button id="selfTab" onclick="showSelf()">Self-Employed</button>
  </div>

  <!-- PAYE SECTION -->
  <div id="payeSection">
    <label>Upload / Capture Payslip</label>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <button class="main" onclick="processPayslip()">Process PAYE</button>
  </div>

  <!-- SELF EMPLOYED SECTION -->
  <div id="selfSection" class="hidden">
    <label>Annual Gross Income (₦)</label>
    <input type="number" id="grossIncome">

    <label>Annual Business Expenses (₦)</label>
    <input type="number" id="expenses">

    <label>Annual Pension (Optional)</label>
    <input type="number" id="pension">

    <button class="main" onclick="calculateSelfEmployed()">Calculate Tax</button>
  </div>

  <div class="loading" id="loading"></div>
  <div class="result" id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
